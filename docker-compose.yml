services:
  node:
    build:
      context: .
    platform: linux/arm64
    container_name: powergrid-node
    working_dir: /workspace
    command: substrate-contracts-node --dev --tmp --rpc-external --rpc-cors all --unsafe-rpc-external
    ports:
      - "9944:9944"
      - "9933:9933"
      - "30333:30333"
    volumes:
      - .:/workspace
    networks:
      - powergrid-network
    restart: unless-stopped

  tester:
    build:
      context: .
    platform: linux/arm64
    container_name: powergrid-tester
    depends_on:
      - node
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - CONTRACTS_NODE=ws://powergrid-node:9944
      - NODE_URL=ws://powergrid-node:9944
    networks:
      - powergrid-network
    stdin_open: true
    tty: true
    command: bash

  # Monolithic container - runs node + deploy in one container
  monolithic:
    build:
      context: .
    platform: linux/arm64
    container_name: powergrid-monolithic
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "9944:9944"
      - "9933:9933"
    networks:
      - powergrid-network
    command: bash -c "./scripts/docker-monolithic-test.sh"

networks:
  powergrid-network:
    driver: bridge
